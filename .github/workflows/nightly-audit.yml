name: Nightly Heavy Audit (Security & Memory Resilience)

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: nightly-audit
  cancel-in-progress: false

jobs:
  heavy_audit:
    name: Heavy Audit (Cargo Audit, E2E Stress & Memory Leak Test)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux WebKitGTK & Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2

      - name: Security Audit (cargo-audit)
        run: |
          cargo install cargo-audit --locked || true
          cargo audit

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: pip install psutil

      - name: Multi-Iteration E2E Contract Testing (Flakiness Detection)
        run: |
          echo "[*] Running iteration 1/3..."
          python3 tests/e2e_runner.py
          echo "[*] Running iteration 2/3..."
          python3 tests/e2e_runner.py
          echo "[*] Running iteration 3/3..."
          python3 tests/e2e_runner.py

      - name: Memory Leak & Footprint Stress Check (< 150MB SLA)
        run: python3 .agents/scripts/memory_check.py

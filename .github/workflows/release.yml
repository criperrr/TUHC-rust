name: Build and Release Desktop App (Tauri 2.0)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v2.8.1)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-tuhc
  cancel-in-progress: false

jobs:
  build_release:
    name: Build & Package Desktop Release (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System Dependencies (Linux WebKitGTK & Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: pip install psutil

      - name: Validate Tests & Memory SLA
        run: |
          cargo test
          python3 tests/e2e_runner.py
          python3 .agents/scripts/memory_check.py

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Tauri Desktop Bundles
        run: cargo tauri build

      - name: Collect Release Artifacts
        id: collect_artifacts
        run: |
          mkdir -p release_assets
          find target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.tar.gz" \) -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

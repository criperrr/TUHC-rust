[package]
name = "tuhc"
version = "2.8.1"
description = "The Unofficial Homestuck Collection - Tauri Edition"
edition = "2021"
rust-version = "1.80"

[lib]
name = "tuhc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
# Tauri 2.0 Core
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"

# Async & Networking
tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
mime_guess = "2.0"
percent-encoding = "2.3"

# Data & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
walkdir = "2.5"

# System Utilities
dirs = "6.0"
libc = "0.2"
log = "0.4"
tempfile = "3.17"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

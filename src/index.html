<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Unofficial Homestuck Collection</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div id="app" class="mspa" data-theme="mspa">
    <!-- Top Browser Chrome: TabBar (Row 1) & AddressBar (Row 2) -->
    <header id="appHeader" class="appHeader">
      <!-- Line 1: Tab Bar (#tab-bar / .tabSection) -->
      <div id="tab-bar" class="tabSection">
        <ul id="tabs" class="tabList" role="tablist">
          <li class="tabShell activeTabShell">
            <div class="tab activeTab" data-tab-key="000" role="tab" aria-selected="true">
              <div class="tabTitle"><span>The Unofficial Homestuck Collection</span></div>
              <div class="systemButton closeTabButton" title="Close Tab (Ctrl+W)">✕</div>
            </div>
          </li>
        </ul>
        <button id="new-tab-btn" class="systemButton newTabButton" title="New tab"><span>＋</span></button>
        <div class="sysActionButtons">
          <button id="bookmarks-toggle-btn" class="systemButton sysActionButton bookmarksButton" title="Bookmarks">
            <svg viewBox="0 0 384 512" width="14" height="14"><path fill="currentColor" d="M0 48C0 21.5 21.5 0 48 0l288 0c26.5 0 48 21.5 48 48l0 440c0 9-5 17.2-13 21.3s-17.6 3.4-24.9-1.8L192 397.5 37.9 507.5c-7.3 5.2-16.9 5.9-24.9 1.8S0 497 0 488L0 48z"/></svg>
          </button>
        </div>
      </div>

      <!-- Line 2: Address Bar (#address-bar / .addressBar) -->
      <div id="address-bar" class="addressBar tabBar">
        <!-- Navigation Buttons: Back, Forward, Reload, Home -->
        <div class="navigationButtons">
          <button id="nav-back-btn" class="systemButton historyButton historyBack" title="Back (Alt+Left)" aria-label="Back" disabled>
            <svg viewBox="0 0 320 512" width="12" height="12"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l192 192c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L77.3 256 246.6 86.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-192 192z"/></svg>
          </button>
          <button id="nav-forward-btn" class="systemButton historyButton historyForward" title="Forward (Alt+Right)" aria-label="Forward" disabled>
            <svg viewBox="0 0 320 512" width="12" height="12"><path fill="currentColor" d="M310.6 233.4c12.5 12.5 12.5 32.8 0 45.3l-192 192c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L242.7 256 73.4 86.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l192 192z"/></svg>
          </button>
          <button id="nav-reload-btn" class="systemButton historyButton refresh" title="Reload Tab" aria-label="Reload">
            <svg viewBox="0 0 512 512" width="12" height="12"><path fill="currentColor" d="M463.5 224H472c13.3 0 24-10.7 24-24V72c0-9.7-5.8-18.5-14.8-22.2s-19.3-1.7-26.2 5.2L413.4 96.6c-87.6-86.5-228.7-86.2-315.8 1c-87.5 87.5-87.5 229.3 0 316.8s229.3 87.5 316.8 0c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0c-62.5 62.5-163.8 62.5-226.3 0s-62.5-163.8 0-226.3c62.2-62.2 162.7-62.5 225.3-1L327 183c-6.9 6.9-8.9 17.2-5.2 26.2s12.5 14.8 22.2 14.8H463.5z"/></svg>
          </button>
          <button id="nav-home-btn" class="systemButton historyButton navHome" title="Homepage" aria-label="Home">
            <svg viewBox="0 0 576 512" width="12" height="12"><path fill="currentColor" d="M575.8 255.5c0 18-15 32.1-32 32.1h-32l.7 160.2c0 17-14 32.2-32 32.2h-64c-17.7 0-32-14.3-32-32V352c0-17.7-14.3-32-32-32h-64c-17.7 0-32 14.3-32 32v96c0 17.7-14.3 32-32 32H96c-17.7 0-32-14.3-32-32.2V287.6H32c-18 0-32-14-32-32.1 0-9 3-17 10-24L266.4 8c7-7 15-8 22-8s15 2 21 7l256.4 224.5c8 7 10 15 10 24z"/></svg>
          </button>
        </div>

        <!-- Address Bar / JumpBox Input -->
        <div id="jumpBox" class="jumpBox">
          <div class="jumpBoxWrapper">
            <a id="jumpbox-link" class="jumpboxLink" title="Navigate (GO)">&gt;</a>
            <input
              id="address-bar-input"
              class="jumpBoxInput"
              type="text"
              value="/"
              placeholder="Enter MSPA URL (e.g. /homestuck/1, /mspa/001901)"
              aria-label="Address Bar"
              autocomplete="off"
              spellcheck="false"
            />
            <div id="browserActions" class="browserActions">
              <div id="bookmark-star-btn" class="systemButton bookmarkStarBtn" title="Bookmark Current Page">
                <svg viewBox="0 0 576 512" width="14" height="14"><path fill="currentColor" d="M316.9 18C311.6 7 300.4 0 288 0s-23.6 7-28.8 18L195.8 150.3 47.9 171.8c-12.1 1.8-22.1 10.5-25.5 22.2s.5 24.3 9.3 33l107 104.3-25.2 147.2c-2.1 12.1 3.1 24.1 13.1 30.9s23 7 33.5 1.4l130.8-68.8 130.8 68.8c10.5 5.5 23.5 5.4 33.5-1.4s15.2-18.8 13.1-30.9L460.9 331.3l107-104.3c8.8-8.6 12.7-21.2 9.3-33s-13.4-20.4-25.5-22.2L400.2 150.3 336.9 18z"/></svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Address Bar Right Actions: Settings Button -->
        <div class="addressActions">
          <button id="nav-settings-btn" class="systemButton sysActionButton settingsButton" title="Settings (⚙)" aria-label="Settings">
            <svg viewBox="0 0 512 512" width="14" height="14"><path fill="currentColor" d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6-4.4 11.9-9.7 23.3-15.8 34.3l-4.7 8.1c-6.6 11-14 21.4-22.1 31.2-5.9 7.2-15.7 9.6-24.5 6.8l-55.7-17.7c-13.4 10.3-28.2 18.9-44 25.4l-12.5 57.1c-2 9.1-9 16.3-18.2 17.8-13.8 2.3-28 3.5-42.5 3.5s-28.7-1.2-42.5-3.5c-9.2-1.5-16.2-8.7-18.2-17.8l-12.5-57.1c-15.8-6.5-30.6-15.1-44-25.4l-55.7 17.7c-8.8 2.8-18.6 .4-24.5-6.8-8.1-9.8-15.5-20.2-22.1-31.2l-4.7-8.1c-6.1-11-11.4-22.4-15.8-34.3-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4c-1.1-8.4-1.7-16.9-1.7-25.5s.6-17.1 1.7-25.4l-43.3-39.4c-6.9-6.2-9.6-15.9-6.4-24.6 4.4-11.9 9.7-23.3 15.8-34.3l4.7-8.1c6.6-11 14-21.4 22.1-31.2 5.9-7.2 15.7-9.6 24.5-6.8l55.7 17.7c13.4-10.3 28.2-18.9 44-25.4l12.5-57.1c2-9.1 9-16.3 18.2-17.8C227.3 1.2 241.5 0 256 0s28.7 1.2 42.5 3.5c9.2 1.5 16.2 8.7 18.2 17.8l12.5 57.1c15.8 6.5 30.6 15.1 44 25.4l55.7-17.7c8.8-2.8 18.6-.4 24.5 6.8 8.1 9.8 15.5 20.2 22.1 31.2l4.7 8.1c6.1 11 11.4 22.4 15.8 34.3zM256 336a80 80 0 1 0 0-160 80 80 0 1 0 0 160z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Slide-out Bookmarks / Save-Load Drawer -->
    <aside id="bookmarks-drawer" class="bookmarksDrawer hidden" aria-label="Saved Game Bookmarks">
      <div class="drawerHeader">
        <h3>SAVED GAMES &amp; BOOKMARKS</h3>
        <button id="bookmarks-close-btn" class="drawerCloseBtn" aria-label="Close Bookmarks">&times;</button>
      </div>
      <div class="drawerActions">
        <button id="new-save-btn" class="primaryActionBtn">+ Save Current Page</button>
      </div>
      <div id="bookmarks-list" class="bookmarksList"></div>
    </aside>

    <!-- Main Viewport Container -->
    <main id="tab-viewport" class="tabFrame">
      <div id="page-container" class="pageBody" data-theme="mspa">
        <!-- Classic MSPA Navigation Banner -->
        <nav id="mspa-nav-banner" class="navBanner customNavBanner" aria-label="MSPA Site Navigation">
          <div class="navList">
            <ul class="nav1">
              <li><a href="/" data-route="/">HOMESTUCK COLLECTION</a></li>
            </ul>
            <div class="candyCorn"></div>
            <ul class="nav2">
              <li><a href="/help" data-route="/help">HELP</a></li>
            </ul>
            <div class="candyCorn"></div>
            <ul class="nav3">
              <li><a href="/map" data-route="/map">MAP</a></li>
              <li><a href="/log" data-route="/log">LOG</a></li>
              <li><a href="/search" data-route="/search">SEARCH</a></li>
            </ul>
            <div class="candyCorn"></div>
            <ul class="nav4">
              <li><a href="/news" data-route="/news">NEWS</a></li>
              <li><a href="/music" data-route="/music">MUSIC</a></li>
            </ul>
            <div class="candyCorn"></div>
            <ul class="nav5">
              <li><a href="/evenmore" data-route="/evenmore">MORE</a></li>
              <li><a href="/settings" data-route="/settings">SETTINGS</a></li>
              <li><a href="/credits" data-route="/credits">CREDITS</a></li>
            </ul>
          </div>
        </nav>

        <!-- Page Frame (950px classic MSPA frame with 650px inner pageContent) -->
        <div id="page-frame" class="pageFrame">
          <div id="page-content" class="pageContent">
            <h2 id="page-title" class="pageTitle">The Unofficial Homestuck Collection</h2>
            <div id="media-container" class="mediaContent"></div>
            <div id="text-container" class="textContent">
              <p id="status" class="prattle">Initializing The Unofficial Homestuck Collection...</p>
            </div>
            <div id="command-container" class="commandContent"></div>
            <div id="footer-nav" class="footerNav"></div>
          </div>
        </div>

        <!-- Authentic 110px Page Footer (Dual Ghost Logos) -->
        <footer id="page-footer" class="footer mspa">
          <img class="bannerImage left" draggable="false" style="display:none;" alt="MSPA Logo" onerror="this.style.display='none'" />
          <img class="bannerImage right" draggable="false" style="display:none;" alt="MSPA Logo" onerror="this.style.display='none'" />
        </footer>
      </div>
    </main>

    <!-- Persistent Sound Test / Music Mini-Player Bar -->
    <section id="sound-test-bar" class="soundTestBar hidden" aria-label="Sound Test Audio Player">
      <div class="soundTestInfo">
        <span id="sound-test-title" class="soundTestTitle">No track loaded</span>
        <span id="sound-test-meta" class="soundTestMeta"></span>
      </div>
      <div class="soundTestControls">
        <button id="sound-test-play-btn" class="soundTestBtn" title="Play / Pause">&#9654;</button>
        <button id="sound-test-stop-btn" class="soundTestBtn" title="Stop">&#9632;</button>
        <audio id="sound-test-audio" controls preload="metadata"></audio>
      </div>
      <button id="sound-test-close-btn" class="soundTestCloseBtn" title="Close Player">&times;</button>
    </section>

    <!-- Floating URL Tooltip (Bottom Left) -->
    <div id="url-tooltip" class="urlTooltip hidden" aria-hidden="true"></div>
  </div>

  <!-- Modular Frontend Subsystem Scripts -->
  <script src="/js/flashProps.js"></script>
  <script src="/js/mediaEngine.js"></script>
  <script src="/js/modHooks.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/debugHud.js"></script>
</body>
</html>
